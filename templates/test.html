<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Navigation</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
    <div class="navbar-left">
        <button id="logo-btn">
            <img src="/static/img/logo.png" alt="Видеозвонок"/>
        </button>
        <button>Профиль</button>
        <button>Войти</button>
        </div>
    <div class="navbar-right">
        <button id="video-call-btn">
            <img src="/static/img/call.png" alt="Видеозвонок"/>
        </button>
    </div>
    </nav>


    <!-- Chat Container -->
    <div class="chat-container">
        <div id="message-container"></div>
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Введите сообщение...">
            <button id="send-btn">
                <img src="/static/img/send.png" alt="Отправить"/>
            </button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        const socket = io();

        const messageContainer = document.getElementById('message-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-btn');

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const message = messageInput.value;
            if (message.trim() === '') return;
            socket.send(message);
            addMessage('Вы', message, 'right');  // Новый цвет для сообщения пользователя
            messageInput.value = '';
        }

        socket.on('message', (msg) => {
            if (msg.startsWith('Бот:')) {
                addMessage('Надежда', msg.replace('Бот: ', ''), 'left');  // Новый цвет для сообщения бота
            }
        });

        function addMessage(sender, message, side) {
            // Создаем div для заголовка с именем отправителя
            const senderDiv = document.createElement('div');
            senderDiv.classList.add('message-sender', side); // Добавляем side для выравнивания
            senderDiv.textContent = sender;

            // Создаем div для сообщения
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', side);
            messageDiv.style.borderRadius = '10px';
            messageDiv.style.padding = '10px';
            messageDiv.style.color = 'white';
            messageDiv.style.maxWidth = '60%';
            messageDiv.style.wordWrap = 'break-word';

            // Форматируем сообщение
            const formattedMessage = message.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            messageDiv.innerHTML = formattedMessage;

            // Добавляем элементы в контейнер сообщений
            messageContainer.appendChild(senderDiv); // сначала добавляем имя
            messageContainer.appendChild(messageDiv); // потом само сообщение
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        socket.send('Привет! Представься как опытный психолог. Напиши что ты опытный психолог и готова помочь. Ты девушка. не больше 10 слов');
        function setVhProperty() {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.0096}px`);
        }
        window.addEventListener('resize', setVhProperty);
        setVhProperty();
    </script>
</body>
</html>
