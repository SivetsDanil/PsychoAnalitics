<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Navigation</title>
    <link rel="stylesheet" href="/static/css/chat.css">

</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <button id="logo-btn">
                <img src="/static/img/logo.png" alt="Логотип"/>
            </button>
        </div>
        <div class="navbar-right">
            <button id="video-call-btn">
                <img src="/static/img/call.png" alt="Видеозвонок"/>
            </button>

        </div>
    </nav>
    <div class="chat-container">
        <div id="message-container"></div>
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Введите сообщение...">
            <button id="micro-btn">
                <img src="/static/img/micro.png" alt="Микрофон"/>
            </button>
            <button id="send-btn">
                <img src="/static/img/send.png" alt="Отправить"/>
            </button>
        </div>
    </div>
    <div id="info-container">
    </div>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
